<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" fill="#f8f9fa"/>
  
  <text x="300" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Pro Micro ATmega32U4 — Pinout</text>
  
  <!-- Board outline -->
  <rect x="150" y="50" width="300" height="180" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="300" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e65100">ATmega32U4 Pro Micro (5V 16MHz)</text>
  
  <!-- Left side pins -->
  <circle cx="170" cy="100" r="5" fill="#ff5722"/>
  <text x="150" y="104" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#333">D2 (INT0)</text>
  
  <circle cx="170" cy="125" r="5" fill="#ff5722"/>
  <text x="150" y="129" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#333">D3 (INT1)</text>
  
  <circle cx="170" cy="150" r="5" fill="#ff5722"/>
  <text x="150" y="154" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#333">GND</text>
  
  <circle cx="170" cy="175" r="5" fill="#ff5722"/>
  <text x="150" y="179" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#333">VCC</text>
  
  <!-- Right side pins -->
  <circle cx="430" cy="100" r="5" fill="#4caf50"/>
  <text x="450" y="104" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333">USB-C</text>
  
  <circle cx="430" cy="125" r="5" fill="#4caf50"/>
  <text x="450" y="129" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333">D+</text>
  
  <circle cx="430" cy="150" r="5" fill="#4caf50"/>
  <text x="450" y="154" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333">D-</text>
  
  <!-- ICSP -->
  <rect x="260" y="190" width="80" height="25" rx="3" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1"/>
  <text x="300" y="207" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">ICSP Header</text>
  
  <!-- Legend -->
  <rect x="50" y="250" width="500" height="30" rx="5" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <circle cx="80" cy="265" r="5" fill="#ff5722"/>
  <text x="95" y="269" font-family="Arial, sans-serif" font-size="10" fill="#333">iCS Decoder GPIO</text>
  
  <circle cx="250" cy="265" r="5" fill="#4caf50"/>
  <text x="265" y="269" font-family="Arial, sans-serif" font-size="10" fill="#333">USB / Power</text>
  
  <circle cx="400" cy="265" r="5" fill="#9e9e9e"/>
  <text x="415" y="269" font-family="Arial, sans-serif" font-size="10" fill="#333">Other pins not used</text>
</svg>
